name: Warm Edge Cache

# WordPress.com deploys the "Publish Website" artifact once that run has finished, so this runs as its own workflow
# after it (a job inside that workflow would hold the deploy back until the warming was done). It waits for the
# deploy, then requests every sitemap URL so the edge cache replaces its pre-deploy copies (scripts/warm-edge-cache.py).
on:
  workflow_run:
    workflows: ["Publish Website"]
    types: [completed]
  workflow_dispatch:
jobs:
  Warm-Edge-Cache:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Each run requests all ~1,800 sitemap URLs over ~30 minutes. Several deploys in a row used to start a run each,
    # and the overlapping runs pushed the site over the host's rate limit, so visitors were served 429. Only the newest
    # run is needed (it warms the latest deploy), so a new one cancels the one in progress. This sits on the job, after
    # the `if`, so a failed or cancelled publish (whose job is skipped) cannot cancel a warmer that is still needed.
    concurrency:
      group: warm-edge-cache
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@master
      - name: Wait for the deploy
        if: github.event_name == 'workflow_run'
        run: sleep 600
      - name: Request every sitemap URL
        run: python3 scripts/warm-edge-cache.py https://bobliftcrane.com
